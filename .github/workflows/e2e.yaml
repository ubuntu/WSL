name: End-to-End Tests
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths-ignore:
      - docs/**
      - '*.md'

jobs:
  end-to-end-tests:
    runs-on: windows-2025
    if: ${{ !github.event.pull_request.draft }}
    env:
      rootFsCache: "${env:USERPROFILE}\\Downloads\\rootfs"
      # TODO: Move this to "Ubuntu" once we have backported everything and Ubuntu is transitionned to 24.04
      distroName: Ubuntu
      appID: Ubuntu
      launcher: ubuntu.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up MSBuild (PATH)
        uses: microsoft/setup-msbuild@v3
      - name: Create and trust a self-signed certificate
        shell: powershell
        run: |
          [xml]$manifest = Get-Content -Path "DistroLauncher-Appx/MyDistro.appxmanifest"
          $publisher = $manifest.SelectSingleNode("/*[local-name()='Package']/*[local-name()='Identity']").GetAttribute("Publisher")
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject $publisher -CertStoreLocation Cert:\CurrentUser\My
          $line = "CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)$([Environment]::NewLine)"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, $line, [System.Text.UTF8Encoding]::new($false))
          Export-Certificate -Cert $certificate -FilePath "$env:RUNNER_TEMP\e2e-signing.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\e2e-signing.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      - name: Install or update WSL
        uses: ./.github/actions/wsl-install
      - name: Download rootfs
        uses: ./.github/actions/download-rootfs
        with:
          distros: ${{ env.distroName }}
          path: ${{ env.rootFsCache }}
      - name: Build and install the appxbundle for testing
        shell: powershell
        run: |
          Write-Output "::group::Clearing leftovers from previous runs"
          $package=$(Get-AppxPackage | Where-Object PackageFullName -like *${{ env.appID }}*)
          If ( $package -ne $null -And $package -ne '' ) {
            Remove-AppxPackage $package
          }
          Write-Output "::endgroup::"

          Write-Output "::group::Building and installing appbundle"
          .\e2e\pre-e2e-testing.ps1 -AppID ${{ env.appID }} -RootfsX64 "${{ env.rootFsCache }}/${{ env.distroName }}.tar.gz" -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT
          Write-Output "::endgroup::"
      - name: Run tests
        shell: powershell
        run: |
          Write-Output "::group::Environment setup"
          $env:LAUNCHER_REPO_ROOT=$PWD
          $env:WSL_UTF8 = 1

          # Shutting down WSL. This is sometimes necessary as it prevents "Access is denied" later.
          wsl.exe --shutdown
          wsl.exe --version
          wsl.exe --unregister '${{ env.distroName }}' 2>&1 | Out-Null

          cd e2e
          Write-Output "::endgroup::"

          Write-Output "::group::Tests"
          go test .\launchertester\ -timeout 30m --distro-name '${{ env.distroName }}' --launcher-name '${{ env.launcher }}'
          $exitStatus=$?
          Write-Output "::endgroup::"
          if ( ! $exitStatus ) { Exit(1) }

      - name: Remove the installed package
        if: always()
        shell: powershell
        run: |
          Remove-AppxPackage "$(Get-AppxPackage | Where-Object PackageFullName -like *${{ env.appID }}*)"
